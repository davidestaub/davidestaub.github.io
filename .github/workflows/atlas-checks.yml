name: Check exoplanet archive
on:
  push:
    paths: ['assets/data/atlas-*.json', 'assets/js/atlas*.js', 'blog/exoplanet-archive.html', 'scripts/validate-atlas*.cjs', '.github/workflows/atlas-checks.yml']
  pull_request:
    paths: ['assets/data/atlas-*.json', 'assets/js/atlas*.js', 'blog/exoplanet-archive.html', 'scripts/validate-atlas*.cjs', '.github/workflows/atlas-checks.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-atlas.cjs
      - run: node scripts/validate-atlas-copy.cjs
